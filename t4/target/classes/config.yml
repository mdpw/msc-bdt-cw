kafka:
  servers: "192.168.1.38:9092"
  container_servers: "kafka:29092"
  twitter_topic: "twitter-posts"
  facebook_topic: "facebook-posts"

  offset_reset: "latest"

  consumer_groups:
    twitter: "twitter-counter"
    facebook: "facebook-counter"

producer:
  data_folder: "data"
  facebook_csv: "Facebook-datasets-enhanced.csv"
  twitter_csv: "Twitter-datasets-enhanced.csv"
  streaming_interval_seconds: 5
  timeout_seconds: 30

flink:
  window_seconds: 15
  watermark_delay_seconds: 20
  parallelism: 2
  job_name: "Social Media Hashtag Counter"

  checkpoint:
    interval_ms: 30000

  jar:
    kafka_connector_jar: "flink-sql-connector-kafka-1.18.0.jar"
    download_url: "https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/1.18.0/flink-sql-connector-kafka-1.18.0.jar"